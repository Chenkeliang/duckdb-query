name: Release Desktop

# Push a tag like v0.0.2 to build all three installers and attach them to a draft Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          # "app" must be listed explicitly: Tauri v2 only emits the macOS updater
          # artifact (.app.tar.gz + .sig, and thus the darwin-* entries in
          # latest.json) for bundles named in --bundles. dmg alone builds the .app
          # internally but skips updater artifacts — which is why every release
          # through v1.1.0 had auto-update working on Windows (nsis IS the updater
          # artifact) but silently missing on macOS.
          - platform: macos-15
            rust_target: aarch64-apple-darwin
            py_arch: arm64
            duck_platform: osx_arm64
            bundles: app,dmg
          # macOS Intel
          - platform: macos-15-intel
            rust_target: x86_64-apple-darwin
            py_arch: x64
            duck_platform: osx_amd64
            bundles: app,dmg
          # Windows x64
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            py_arch: x64
            duck_platform: windows_amd64
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # ---- Python backend (PyInstaller onedir) ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.py_arch }}
          cache: pip

      - name: Install backend deps
        run: pip install -r api/requirements.txt pyinstaller

      - name: Pre-download DuckDB extensions (offline)
        run: python api/scripts/fetch_duckdb_extensions.py ${{ matrix.duck_platform }}

      - name: Build backend (PyInstaller onedir)
        working-directory: api
        run: pyinstaller duckquery.spec --noconfirm --distpath dist --workpath build

      # 冻结包冒烟:启动真实产物跑保真查询电池。测试环境全绿 ≠ 冻结包可用
      # (v1.1.5 曾因 spec excludes 与代码不匹配发出坏包),失败即中止发布。
      - name: Frozen bundle smoke test
        working-directory: api
        timeout-minutes: 15
        run: python scripts/frozen_smoke.py

      # ---- Stage the onedir as a Tauri bundle resource ----
      - name: Stage sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf frontend/src-tauri/binaries/duckquery-api
          mkdir -p frontend/src-tauri/binaries
          cp -R api/dist/duckquery-api frontend/src-tauri/binaries/duckquery-api
          # Ad-hoc sign every Mach-O so the downloaded .app is not rejected as "damaged"
          # on Apple Silicon (arm64 requires at least an ad-hoc signature to execute).
          find frontend/src-tauri/binaries/duckquery-api \
            \( -name '*.so' -o -name '*.dylib' -o -name 'duckquery-api' \) -type f \
            -exec codesign --force --timestamp=none --sign - {} +

      - name: Stage sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path frontend/src-tauri/binaries/duckquery-api) { Remove-Item -Recurse -Force frontend/src-tauri/binaries/duckquery-api }
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          Copy-Item -Recurse api/dist/duckquery-api frontend/src-tauri/binaries/duckquery-api
        shell: pwsh

      # ---- Frontend + Rust + bundle ----
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"

      - name: Build & release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # In-app updater: sign update artifacts and emit latest.json into the
          # release (createUpdaterArtifacts in tauri.conf.json). The private key
          # lives only in repo secrets; the matching pubkey is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # No Apple Developer ID signing — the macOS bundler uses ad-hoc signing
          # (signingIdentity "-" in tauri.conf.json). Do NOT pass APPLE_* env vars:
          # an undefined secret expands to an EMPTY string (not "unset"), and the
          # Tauri bundler treats a set-but-empty APPLE_CERTIFICATE as "import this
          # cert", then fails on `security import` of empty data. Omitting them keeps
          # the bundler on the ad-hoc path. (First run still needs "Open Anyway".)
        with:
          projectPath: frontend
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "DuckQuery v__VERSION__"
          releaseBody: "Desktop builds. See the README for first-run steps (macOS: 隐私与安全性 → 仍要打开; Windows: SmartScreen → 仍要运行)."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      # ---- 离线全量包(第二资产,不进更新通道) ----
      # 标准包只含 excel 扩展、Windows 用 WebView2 downloadBootstrapper(~90MB);
      # -offline 包给内网/无外网环境:全量 DuckDB 扩展(excel/httpfs/mysql/postgres),
      # Windows 另内嵌 WebView2 离线安装器。overlay 配置关闭 updater 产物,
      # latest.json/更新通道始终指向瘦包(已装用户的扩展在用户目录,更新不受影响)。
      - name: Fetch full extensions (offline bundle)
        run: python api/scripts/fetch_duckdb_extensions.py ${{ matrix.duck_platform }} --full

      - name: Refresh staged sidecar extensions (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf frontend/src-tauri/binaries/duckquery-api/extensions
          cp -R api/extensions frontend/src-tauri/binaries/duckquery-api/extensions

      - name: Refresh staged sidecar extensions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dst = "frontend/src-tauri/binaries/duckquery-api/extensions"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          Copy-Item -Recurse api/extensions $dst

      - name: Build offline bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: frontend
        run: npx tauri build --target ${{ matrix.rust_target }} --bundles dmg --config src-tauri/tauri.offline.conf.json

      - name: Build offline bundle (Windows)
        if: runner.os == 'Windows'
        working-directory: frontend
        shell: pwsh
        run: npx tauri build --target ${{ matrix.rust_target }} --bundles nsis --config src-tauri/tauri.offline.conf.json

      - name: Upload offline bundle (macOS)
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "${{ matrix.rust_target }}" in
            aarch64-*) ARCH=aarch64 ;;
            *) ARCH=x64 ;;
          esac
          DMG=$(ls frontend/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg | head -1)
          OUT="DuckQuery_${VERSION}_${ARCH}-offline.dmg"
          cp "$DMG" "$OUT"
          gh release upload "${GITHUB_REF_NAME}" "$OUT" --clobber

      - name: Upload offline bundle (Windows)
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $bundleDir = "frontend/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis"
          $installer = Get-ChildItem $bundleDir -Filter "*.exe" |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (!$installer) { Write-Error "Missing offline NSIS installer in $bundleDir"; exit 1 }
          $out = "DuckQuery_${version}_x64-offline-setup.exe"
          Copy-Item $installer.FullName $out -Force
          gh release upload "${env:GITHUB_REF_NAME}" $out --repo "${env:GITHUB_REPOSITORY}" --clobber
