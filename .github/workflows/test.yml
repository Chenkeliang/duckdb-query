name: Tests

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Run pytest
        env:
          DUCKDB_DATA_DIR: ${{ runner.temp }}/duckquery-test/duckdb
          DUCKDB_DATABASE_PATH: ${{ runner.temp }}/duckquery-test/duckdb/main.db
        run: |
          mkdir -p "$DUCKDB_DATA_DIR"
          cd api
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          python -m pytest tests -q --tb=short

  remote-semantic-test:
    name: Remote DB Semantic Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: duckquery-test
          MYSQL_DATABASE: duckquery_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pduckquery-test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: duckquery-test
          POSTGRES_DB: duckquery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d duckquery_test"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and pinned DuckDB extensions
        run: |
          cd api
          pip install -r requirements.txt
          python - <<'PY'
          import duckdb
          with duckdb.connect(":memory:") as connection:
              connection.execute("INSTALL mysql")
              connection.execute("INSTALL postgres")
          PY

      - name: Run real remote semantic matrix
        env:
          DUCKQUERY_TEST_MYSQL_HOST: 127.0.0.1
          DUCKQUERY_TEST_MYSQL_PORT: "3306"
          DUCKQUERY_TEST_MYSQL_PASSWORD: duckquery-test
          DUCKQUERY_TEST_MYSQL_DATABASE: duckquery_test
          DUCKQUERY_TEST_POSTGRES_HOST: 127.0.0.1
          DUCKQUERY_TEST_POSTGRES_PORT: "5432"
          DUCKQUERY_TEST_POSTGRES_PASSWORD: duckquery-test
          DUCKQUERY_TEST_POSTGRES_DATABASE: duckquery_test
        run: |
          cd api
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          python -m pytest tests/test_remote_database_semantics.py -q --tb=short

  frontend-test:
    name: Frontend Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Vitest
        run: cd frontend && npm test

      - name: Build production frontend
        run: cd frontend && npm run build

  mcp-test:
    name: MCP Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock

      - name: Install MCP (editable) + dev deps
        run: cd mcp && uv sync --frozen --extra dev

      - name: Run MCP pytest
        run: cd mcp && uv run python -m pytest tests -q --tb=short

  rust-test:
    name: Tauri Rust Cargo Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Provide frontend dist and sidecar placeholders
        # tauri::generate_context! 编译期要求 frontendDist 与 resources
        # (binaries/duckquery-api) 目录都存在;单测无需真实产物。本地能过是
        # 因为开发机有真实 sidecar,干净 CI 必须占位(2026-07-23 发布检查发现)
        run: |
          mkdir -p frontend/dist
          echo "<!doctype html><title>test</title>" > frontend/dist/index.html
          mkdir -p frontend/src-tauri/binaries/duckquery-api
          touch frontend/src-tauri/binaries/duckquery-api/.placeholder

      - name: Cargo test
        run: cd frontend/src-tauri && cargo test
