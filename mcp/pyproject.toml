[project]
name = "duckquery-mcp"
version = "0.3.0"
description = "MCP server for a locally-running DuckQuery backend"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chen" }]
keywords = ["mcp", "duckdb", "sql", "data-analysis", "duckquery"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Chenkeliang/duckdb-query"
Repository = "https://github.com/Chenkeliang/duckdb-query"
Issues = "https://github.com/Chenkeliang/duckdb-query/issues"

[project.scripts]
duckquery-mcp = "duckquery_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
