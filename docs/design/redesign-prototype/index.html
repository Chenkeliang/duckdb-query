<!doctype html>

<script>
  try{const t=localStorage.getItem('dqp-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}

</head>

  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></symbol>

  <symbol id="i-min" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></symbol>
  <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></symbol>

  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></symbol>

  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5A6 6 0 1 0 7.5 11.5C8.3 12.3 8.8 13 9 14M9 18h6M10 22h4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-gh" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.1-1.3-.3-2.5-1-3.5.3-1.2.3-2.4 0-3.5 0 0-1 0-3 1.5a10.6 10.6 0 0 0-8 0C6 2 5 2 5 2c-.3 1.2-.3 2.4 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.4.5-.7 1-.9 1.7-.2.6-.2 1.2-.1 1.8v4M9 18c-4.5 2-5-2-7-2"/></symbol>

  <symbol id="i-desc" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
  <symbol id="i-hdd" viewBox="0 0 24 24"><path d="M22 12H2M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1zM6 16h.01M10 16h.01"/></symbol>

  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8z"/></symbol>
</svg>

<div class="app" id="app">
  <!-- rail -->
  <nav class="rail" aria-label="主导航">
    <div class="logo" aria-label="DuckQuery">
      <svg viewBox="8 15 92 70"><rect x="22" y="55" width="14" height="25" rx="3" fill="#d97706"/><rect x="42" y="42" width="14" height="38" rx="3" fill="#f59e0b"/><rect x="62" y="22" width="14" height="58" rx="3" fill="#fbbf24"/><path d="M76 32h10c2 0 3 1 3 3v4c0 2-1 3-3 3H76" fill="#f97316"/><circle cx="69" cy="32" r="3" fill="#fff"/></svg>
    </div>
    <button class="rb tip on" data-view="work" data-i-tip="nav.work" aria-label=""><svg class="i l"><use href="#i-code"/></svg></button>
    <button class="rb tip" data-view="sources" data-i-tip="nav.sources" aria-label=""><svg class="i l"><use href="#i-db"/></svg></button>
    <button class="rb tip" id="railAi" data-i-tip="nav.ai" data-prop="2" aria-label=""><svg class="i l"><use href="#i-spark"/></svg></button>
    <button class="rb tip" data-view="ext" data-i-tip="nav.ext" aria-label=""><svg class="i l"><use href="#i-blocks"/></svg></button>
    <div class="sp"></div>
    <button class="rb tip" data-view="settings" data-i-tip="nav.settings" aria-label=""><svg class="i l"><use href="#i-sliders"/></svg></button>
  </nav>

  <!-- explorer -->
  <aside class="explorer" id="explorer">
    <div class="exp-head">
      <div class="seg" role="tablist" data-prop="1">
        <button class="on" data-exp="sources" data-i="exp.sources"></button>
        <button data-exp="saved" data-i="exp.saved"></button>
        <button data-exp="runs"><span data-i="exp.runs"></span><span class="count" id="runCount"></span></button>
      </div>
    </div>
    <label class="search"><svg class="i s"><use href="#i-search"/></svg><input id="treeFilter" data-i-ph="exp.filter"><kbd>/</kbd></label>
    <div class="tree" id="tree"></div>
    <div class="exp-foot">
      <button class="btn line wide" data-act="addData" data-prop="3"><svg class="i"><use href="#i-plus"/></svg><span data-i="act.addData"></span><kbd>⌘N</kbd></button>
      <button class="ib" data-act="refreshTree" data-i-title="act.refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="vsplit" id="vsplit"></div>
  </aside>

  <main>
    <!-- WORKBENCH -->
    <section class="view on" id="v-work">
      <div class="etabs" id="etabs" data-prop="4"></div>
      <div class="toolbar">
        <button class="ib only-narrow" data-act="toggleExp" data-i-title="exp.sources"><svg class="i"><use href="#i-panel"/></svg></button>
        <button class="runbtn" id="runBtn"><svg class="i"><use href="#i-play"/></svg><span data-i="tb.run"></span><kbd>⌘↵</kbd></button>
        <button class="btn" data-act="runAsync"><svg class="i"><use href="#i-clock"/></svg><span data-i="tb.async"></span></button>
        <button class="btn tb-hide" data-act="format"><svg class="i"><use href="#i-align"/></svg><span data-i="tb.format"></span></button>
        <button class="btn tb-hide" data-act="bookmark"><svg class="i"><use href="#i-star"/></svg><span data-i="tb.save"></span></button>
        <div class="vsep tb-hide"></div>
        <button class="btn" data-act="toggleAi"><svg class="i"><use href="#i-spark"/></svg><span data-i="tb.ask"></span><kbd>⌘I</kbd></button>
        <button class="ib tb-more" data-act="tbMore" data-i-title="tb.more"><svg class="i"><use href="#i-more"/></svg></button>
        <div class="sp"></div>
        <button class="chip" id="fedChip" data-act="fedMenu"></button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="editor" id="editor">
        <div class="gutter" id="gutter"></div>
        <div class="code"><div class="curline" id="curline"></div><pre id="hl" aria-hidden="true"></pre><textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SQL"></textarea></div>
      </div>
      <div class="builder" id="builder"></div>
      <div class="hsplit" id="hsplit" role="separator" aria-orientation="horizontal"></div>
      <section class="results">
        <div class="rbar">
          <button class="rtab on" data-rt="grid"><svg class="i s"><use href="#i-table"/></svg><span data-i="rt.grid"></span><span class="cnt" id="cntGrid"></span></button>
          <button class="rtab" data-rt="chart"><svg class="i s"><use href="#i-chart"/></svg><span data-i="rt.chart"></span></button>
          <button class="rtab" data-rt="msgs"><svg class="i s"><use href="#i-msg"/></svg><span data-i="rt.msgs"></span><span class="cnt" id="cntMsgs"></span></button>
          <div class="sp"></div>
          <button class="btn" data-act="colsMenu"><svg class="i s"><use href="#i-columns"/></svg><span class="lbl" data-i="rb.cols"></span></button>
          <button class="btn" data-act="copy"><svg class="i s"><use href="#i-copy"/></svg><span class="lbl" data-i="rb.copy"></span></button>
          <button class="btn" data-act="saveTable"><svg class="i s"><use href="#i-db"/></svg><span class="lbl" data-i="rb.saveTable"></span></button>
          <button class="btn" data-act="exportMenu"><svg class="i s"><use href="#i-download"/></svg><span class="lbl" data-i="rb.export"></span><svg class="i s"><use href="#i-down"/></svg></button>
          <button class="ib" data-act="max" data-i-title="rb.max" id="maxBtn"><svg class="i s"><use href="#i-max"/></svg></button>
        </div>
        <div class="rbody" id="rbody"></div>
        <div class="rfoot" id="rfoot"></div>
      </section>
    </section>

    <!-- DATA SOURCES -->
    <section class="view" id="v-sources"><div class="page"><div class="page-in" id="sourcesPage"></div></div></section>
    <!-- EXTENSIONS -->
    <section class="view" id="v-ext"><div class="page"><div class="page-in" id="extPage"></div></div></section>
    <!-- SETTINGS -->
    <section class="view" id="v-settings"><div class="page"><div class="settings" id="settingsPage"></div></div></section>
  </main>

  <!-- AI panel -->
  <aside class="ai" id="ai" data-prop="2"></aside>

  <footer class="status" id="status"></footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="cmdk" id="cmdk" role="dialog" aria-modal="true" aria-label="Command">
  <div class="q"><svg class="i l"><use href="#i-search"/></svg><input id="cmdkInput" data-i-ph="cmdk.ph" autocomplete="off"><kbd>esc</kbd></div>
  <div class="res" id="cmdkRes" role="listbox"></div>
  <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> <span data-i="cmdk.nav"></span></span><span><kbd>↵</kbd> <span data-i="cmdk.go"></span></span><span><kbd>⌘K</kbd> <span data-i="cmdk.toggle"></span></span></div>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true"></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
<div class="menu" id="menu" role="menu"></div>
<div class="props" id="props"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="ctip" id="ctip"></div>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>
</html>
