[package]
name = "duckquery"
version = "1.2.0"
description = "DuckQuery — AI visual SQL workbench for files and databases"
authors = ["Chenkeliang"]
license = "MIT"
repository = "https://github.com/Chenkeliang/duckdb-query"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "duckquery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
# 网格导出直写:save 对话框选中的路径由 dialog 插件动态授权给 fs 插件写入
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# open_external 用:ShellExecuteW 级别的跨平台"用默认程序打开"。直接 spawn
# explorer.exe 在 URL 带 query string 时会静默失败(Windows 下载无反应的根因)。
open = "5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
